[project]
name = "mcp-center"
version = "1.0.0"
description = "MCP Center - OAuth 2.1 Authorization Server and control plane for your MCP servers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.43",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0.0",
    "pyjwt>=2.12.1",
    "bcrypt>=4.0.0",
    "apscheduler>=3.10.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "docker>=7.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.10"]

[project.scripts]
mcp-center = "main:main"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src", "db"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
    "fastmcp>=3.0.0",
    "psycopg2-binary>=2.9.10",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", ".claude", "alembic/versions", "static", "frontend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# alembic/env.py must set up sys.path before importing the app
"alembic/env.py" = ["E402"]
